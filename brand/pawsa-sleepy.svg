  <path d="M 72 82 Q 80 90 88 82" fill="none" stroke="#2B1B12" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 112 82 Q 120 90 128 82" fill="none" stroke="#2B1B12" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 94 98 Q 100 96 106 98 Q 104 104 100 105 Q 96 104 94 98 Z" fill="#E8768A" stroke="#6B3308" stroke-width="1.5" stroke-linejoin="round"/>
