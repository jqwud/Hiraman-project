# Checks every push and pull request: the API tests on a real MySQL, the app's analysis and tests,
# the portal's lint and build, and end-to-end tests of the portal and the app against a real server.
# Nothing here deploys anything.
name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: API (lint and tests on MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: hiraman_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-root-password
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: mysqldump --version   # the backup and restore tests need the MySQL command-line tools
      - run: npm ci
      - run: npm run lint
      - run: npm test

  app:
    name: App (analyze and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  containers:
    name: Containers (build, start, health check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings for this run only (a fresh random secret)
        run: |
          cp docker.env.example docker.env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" docker.env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: curl -fsS http://localhost:4000/api/health
      - run: curl -fsS http://localhost:4000/ | grep -q 'id="root"'
      - run: docker compose exec -T api npm run migrate:status
      - name: Logs if something failed
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  portal:
    name: Portal (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End to end (portal in a browser, app screens on the real API)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: hiraman_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-root-password
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            portal/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: portal
      - run: npx playwright install --with-deps chromium
        working-directory: portal
      - run: npm run test:e2e
        working-directory: portal
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: node tools/e2e.mjs
        working-directory: app
